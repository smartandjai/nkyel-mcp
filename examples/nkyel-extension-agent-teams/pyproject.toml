[project]
name = "nkyel-extension-agent-teams"
version = "0.1.0"
description = "Peer collaboration between full nkyel Custom Agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nkyel-extension-api>=0.2.5,<0.3", "langchain>=1.2,<2"]

[project.entry-points."nkyel.extensions"]
agent-teams = "nkyel_extension_agent_teams:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nkyel_extension_agent_teams"]

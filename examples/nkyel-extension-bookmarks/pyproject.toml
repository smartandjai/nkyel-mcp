[project]
name = "nkyel-extension-bookmarks"
version = "0.2.0"
description = "Pi-inspired conversation bookmarks for the nkyel full-stack plugin API"
requires-python = ">=3.12"
license = "MIT"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = ["nkyel-extension-api>=0.2.3,<0.3"]

[project.entry-points."nkyel.extensions"]
bookmarks = "nkyel_extension_bookmarks:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nkyel_extension_bookmarks"]

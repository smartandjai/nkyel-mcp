[project]
name = "nkyel-extension-report-sections"
version = "0.1.0"
description = "Sectioned long-form report writing with assembled artifact delivery for nkyel"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nkyel-extension-api>=0.2.8,<0.3"]

[project.entry-points."nkyel.extensions"]
report-sections = "nkyel_extension_report_sections:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nkyel_extension_report_sections"]

[project]
name = "nkyel-extension-retrieval"
version = "0.1.0"
description = "Offline synthetic retrieval example for nkyel plugin tool artifacts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["nkyel-extension-api>=0.2.6,<0.3"]

[project.entry-points."nkyel.extensions"]
retrieval = "nkyel_extension_retrieval:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nkyel_extension_retrieval"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

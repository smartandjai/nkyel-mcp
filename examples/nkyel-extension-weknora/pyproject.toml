[project]
name = "nkyel-extension-weknora"
version = "0.1.0"
description = "Read-only WeKnora retrieval and scope provider for nkyel"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nkyel-extension-api>=0.2.7,<0.3", "nkyel-harness>=2.1,<3", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.entry-points."nkyel.extensions"]
weknora = "nkyel_extension_weknora:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nkyel_extension_weknora"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
